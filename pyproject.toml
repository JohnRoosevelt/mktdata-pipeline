[project]
name = "mktdata-pipeline"
version = "0.1.0"
description = "Market data pipeline practice: normalize -> parquet -> duckdb analytics"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12",
    "pyarrow>=15",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
